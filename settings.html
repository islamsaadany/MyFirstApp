<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007AFF">
    <title>Settings - Focus Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="settings-container">
        <div class="settings-header">
            <button class="back-btn" onclick="window.location.href='index.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1>Settings</h1>
        </div>

        <form class="settings-form" id="settingsForm">
            <!-- Work Duration -->
            <div class="form-group">
                <label>Work Duration: <span id="workDurationValue">25</span> minutes</label>
                <div class="duration-selector">
                    <button type="button" class="duration-btn" data-duration="5" data-type="work">5</button>
                    <button type="button" class="duration-btn" data-duration="10" data-type="work">10</button>
                    <button type="button" class="duration-btn" data-duration="15" data-type="work">15</button>
                    <button type="button" class="duration-btn" data-duration="20" data-type="work">20</button>
                    <button type="button" class="duration-btn active" data-duration="25" data-type="work">25</button>
                    <button type="button" class="duration-btn" data-duration="30" data-type="work">30</button>
                    <button type="button" class="duration-btn" data-duration="45" data-type="work">45</button>
                    <button type="button" class="duration-btn" data-duration="60" data-type="work">60</button>
                </div>
                <div class="duration-info">Choose your focus session duration</div>
            </div>

            <!-- Break Duration -->
            <div class="form-group">
                <label>Break Duration: <span id="breakDurationValue">5</span> minutes</label>
                <div class="duration-selector">
                    <button type="button" class="duration-btn active" data-duration="5" data-type="break">5</button>
                    <button type="button" class="duration-btn" data-duration="10" data-type="break">10</button>
                    <button type="button" class="duration-btn" data-duration="15" data-type="break">15</button>
                    <button type="button" class="duration-btn" data-duration="20" data-type="break">20</button>
                    <button type="button" class="duration-btn" data-duration="25" data-type="break">25</button>
                    <button type="button" class="duration-btn" data-duration="30" data-type="break">30</button>
                </div>
                <div class="duration-info">Choose your break duration</div>
            </div>

            <!-- Notification Sound -->
            <div class="form-group">
                <label for="notificationSound">Notification Sound</label>
                <div class="sound-selector">
                    <select id="notificationSound" name="notificationSound">
                        <option value="default">Default Chime</option>
                        <option value="bell">Bell</option>
                        <option value="chime">Soft Chime</option>
                        <option value="ding">Ding</option>
                        <option value="gentle">Gentle Alert</option>
                    </select>
                    <button type="button" class="btn btn-secondary test-sound-btn" id="testSoundBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                        Test
                    </button>
                </div>
            </div>

            <!-- Work Complete Messages -->
            <div class="form-group">
                <label>Work Complete Messages</label>
                <div class="message-list" id="workMessagesList">
                    <!-- Messages will be added here dynamically -->
                </div>
                <button type="button" class="btn btn-secondary add-message-btn" id="addWorkMessageBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Message
                </button>
            </div>

            <!-- Break Complete Messages -->
            <div class="form-group">
                <label>Break Complete Messages</label>
                <div class="message-list" id="breakMessagesList">
                    <!-- Messages will be added here dynamically -->
                </div>
                <button type="button" class="btn btn-secondary add-message-btn" id="addBreakMessageBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Message
                </button>
            </div>

            <!-- Session Reset -->
            <div class="form-group">
                <label>Session Counter</label>
                <button type="button" class="btn btn-secondary reset-sessions-btn" id="resetSessionsBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M3 21v-5h5"></path>
                    </svg>
                    Reset Sessions Completed Today
                </button>
            </div>

            <button type="submit" class="btn btn-primary save-btn">Save Settings</button>
        </form>
    </div>

    <script src="js/sounds.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
