<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007AFF">
    <title>Settings - Focus Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="settings-container">
        <div class="settings-header">
            <button class="back-btn" onclick="window.location.href='index.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1>Settings</h1>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab active" data-tab="timer">⏰ Timer</button>
            <button class="tab" data-tab="sounds">🔔 Sounds</button>
            <button class="tab" data-tab="messages">💬 Messages</button>
            <button class="tab" data-tab="data">📊 Data</button>
        </div>

        <form class="settings-form" id="settingsForm">
            <!-- Tab 1: Timer -->
            <div class="tab-content active" data-content="timer">
                <div class="form-group">
                    <label class="section-title">Work Duration</label>
                    <div class="section-subtitle">Choose how long you want to focus</div>
                    <div class="duration-value"><span id="workDurationValue">25</span> minutes</div>
                    <div class="duration-selector">
                        <button type="button" class="duration-btn" data-duration="5" data-type="work">5</button>
                        <button type="button" class="duration-btn" data-duration="10" data-type="work">10</button>
                        <button type="button" class="duration-btn" data-duration="15" data-type="work">15</button>
                        <button type="button" class="duration-btn" data-duration="20" data-type="work">20</button>
                        <button type="button" class="duration-btn active" data-duration="25" data-type="work">25</button>
                        <button type="button" class="duration-btn" data-duration="30" data-type="work">30</button>
                        <button type="button" class="duration-btn" data-duration="45" data-type="work">45</button>
                        <button type="button" class="duration-btn" data-duration="60" data-type="work">60</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="section-title">Break Duration</label>
                    <div class="section-subtitle">Time to recharge and relax</div>
                    <div class="duration-value"><span id="breakDurationValue">5</span> minutes</div>
                    <div class="duration-selector">
                        <button type="button" class="duration-btn active" data-duration="5" data-type="break">5</button>
                        <button type="button" class="duration-btn" data-duration="10" data-type="break">10</button>
                        <button type="button" class="duration-btn" data-duration="15" data-type="break">15</button>
                        <button type="button" class="duration-btn" data-duration="20" data-type="break">20</button>
                        <button type="button" class="duration-btn" data-duration="25" data-type="break">25</button>
                        <button type="button" class="duration-btn" data-duration="30" data-type="break">30</button>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Sounds -->
            <div class="tab-content" data-content="sounds">
                <div class="form-group">
                    <label class="section-title">Notification Sound</label>
                    <div class="section-subtitle">Choose a sound that helps you stay focused</div>
                    <div class="sound-selector-tabbed">
                        <div class="sound-option" data-sound="default">
                            <div class="radio"></div>
                            <div class="sound-name">Default Chime</div>
                            <button type="button" class="play-btn" data-sound="default">▶</button>
                        </div>
                        <div class="sound-option" data-sound="bell">
                            <div class="radio"></div>
                            <div class="sound-name">Bell</div>
                            <button type="button" class="play-btn" data-sound="bell">▶</button>
                        </div>
                        <div class="sound-option" data-sound="chime">
                            <div class="radio"></div>
                            <div class="sound-name">Soft Chime</div>
                            <button type="button" class="play-btn" data-sound="chime">▶</button>
                        </div>
                        <div class="sound-option" data-sound="ding">
                            <div class="radio"></div>
                            <div class="sound-name">Ding</div>
                            <button type="button" class="play-btn" data-sound="ding">▶</button>
                        </div>
                        <div class="sound-option" data-sound="gentle">
                            <div class="radio"></div>
                            <div class="sound-name">Gentle Alert</div>
                            <button type="button" class="play-btn" data-sound="gentle">▶</button>
                        </div>
                    </div>
                    <!-- Hidden select for backward compatibility with settings.js -->
                    <select id="notificationSound" name="notificationSound" style="display: none;">
                        <option value="default">Default Chime</option>
                        <option value="bell">Bell</option>
                        <option value="chime">Soft Chime</option>
                        <option value="ding">Ding</option>
                        <option value="gentle">Gentle Alert</option>
                    </select>
                </div>
            </div>

            <!-- Tab 3: Messages -->
            <div class="tab-content" data-content="messages">
                <div class="form-group">
                    <label class="section-title">Work Complete Messages</label>
                    <div class="section-subtitle">Messages shown when it's time for a break</div>
                    <div class="message-list" id="workMessagesList">
                        <!-- Messages will be added here dynamically -->
                    </div>
                    <button type="button" class="btn btn-secondary add-message-btn" id="addWorkMessageBtn">+ Add Message</button>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <label class="section-title">Break Complete Messages</label>
                    <div class="section-subtitle">Messages shown when it's time to work</div>
                    <div class="message-list" id="breakMessagesList">
                        <!-- Messages will be added here dynamically -->
                    </div>
                    <button type="button" class="btn btn-secondary add-message-btn" id="addBreakMessageBtn">+ Add Message</button>
                </div>
            </div>

            <!-- Tab 4: Data -->
            <div class="tab-content" data-content="data">
                <div class="form-group">
                    <label class="section-title">Session Data</label>
                    <div class="reset-section">
                        <div class="reset-info">Reset your session counter for today</div>
                        <button type="button" class="btn btn-warning" id="resetSessionsBtn">Reset Sessions</button>
                    </div>
                </div>
            </div>

            <!-- Save Button Footer -->
            <div class="save-footer">
                <button type="submit" class="btn btn-primary save-btn">Save Settings</button>
            </div>
        </form>
    </div>

    <script src="js/sounds.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
